name: Deploy

# Cutover in progress: this builds once and publishes to BOTH GitHub Pages and
# the Namecheap host, so the live site never depends on the new path working.
# Once DNS points at 104.207.79.87 and the Namecheap copy is confirmed good,
# delete the `pages` job, the `pages`/`id-token` permissions and the
# `github-pages` environment — the whole reason for moving is that Pages needs
# a public repo on the free plan.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  ftp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # The FTP account is chrooted to its own home, so this is relative to
          # that — it only lands on the web if that home IS the doc root.
          local-dir: ./dist/
          server-dir: ./
          # Namecheap's cert is for the shared host, not heartsaglow.io.
          security: loose

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - id: deployment
        uses: actions/deploy-pages@v4
