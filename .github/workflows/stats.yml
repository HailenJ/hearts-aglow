name: Stats

# Deploys the private stats Worker (stats/). Separate from the public site's
# deploy.yml, which never sees this folder. Tests always run; the deploy step
# only runs once the CLOUDFLARE_API_TOKEN secret exists, so merging before the
# one-time setup (docs/stats-setup.md) does not turn main red.

on:
  push:
    branches: [main]
    paths: ['stats/**', '.github/workflows/stats.yml']

permissions:
  contents: read

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stats/package-lock.json
      - run: npm ci
      - run: npm test
      # `secrets` is not available in a step-level `if`, so check through env.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, tests passed, skipping deploy. See docs/stats-setup.md."
            exit 0
          fi
          npm run deploy
