  <body>
    <!--
      THESIS: A Turrell Ganzfeld with an operating system floating in it. Refuses
      the studio-portfolio default of a dark page with a neon accent over a grid
      of album cards; the ground itself is the primary visual event.
      OWN-WORLD: The ground is the visualiser — it pulses at the loaded record's
      tempo, takes that record's hue, and raises embers as windows open; it is
      not audio-reactive and does not pretend to be. Void #08070b under three
      gaussian light blooms cycling rose
      #ff4d6d to peach #ffa878 over a wine #7a2f43 floor across ~12 minutes,
      dithered so no edge ever forms. Ember rather than violet so the ground
      burns the same colours the brand marks already use.
      Signal cyan #dff4ff on focus, active state, live data, and primary
      interactive affordance (.hero__cta-go, .game__submit, .game__store) —
      nowhere else. Text: --text rgba(255,255,255,0.95), --text-dim
      rgba(255,255,255,0.80), --text-faint rgba(255,255,255,0.66), raised
      during the build against the light field's brightest phase, re-measured for
      the ember palette with its reactive layer at full energy, rgb(128,80,69):
      --text clears WCAG AA 4.5:1 at 6.21:1, --text-dim at 4.95:1, --text-faint
      clears AA for large text (see DESIGN.md Open Question 4). Anybody (display),
      Archivo (body), Martian Mono (data). Hairline glass panes, 3px radii,
      film grain over everything.
      STORY: The visitor arrives inside a slow light field, finds a quiet OS in
      it, follows one line to the game, and stays for the music.
      FIRST VIEWPORT: Centred wordmark over the field, tagline beneath, hairline
      rule, then the single game CTA. Dock of four fixed at the bottom.
      FORM: desktop-OS-in-a-light-field; user-pinned direction; seed key 155321e4.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
